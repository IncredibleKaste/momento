html[data-theme="dark"] body{background:#211f1b;color:#eee8dc}html[data-theme="light"] body{background:#f6f1e6;color:#302d27}

/* One transparent rail; labels expand together without shifting the feed. */
.rail{align-items:flex-start;padding-left:6px;transition:width .18s ease}
.rail:hover,.rail:has(.nav-button:focus-visible){width:218px}
.nav-items{align-items:flex-start;gap:16px}
.nav-button{width:46px;display:flex;align-items:center;justify-content:flex-start;padding:0 11px;flex-shrink:0;border-radius:2px;transition:width .18s ease,background .12s ease}
.nav-button svg{flex:none}.theme-control #theme-icon{display:flex}
.rail:hover .nav-button,.rail:has(.nav-button:focus-visible) .nav-button{width:202px}
.nav-label{left:55px;top:0;height:46px;display:flex;align-items:center;padding:0;background:none;border:0;box-shadow:none;color:var(--ink);font-size:20px;line-height:23px;font-weight:500;pointer-events:none}
.rail:hover .nav-label,.rail:has(.nav-button:focus-visible) .nav-label{opacity:1;visibility:visible;transform:none}
.nav-button:hover,.nav-button:focus-visible{background:color-mix(in srgb,var(--accent) 55%,var(--bg));color:var(--ink)}
html[data-theme="dark"] .nav-button:hover,html[data-theme="dark"] .nav-button:focus-visible{background:color-mix(in srgb,var(--accent) 35%,var(--bg))}
.nav-button[aria-current=page]:before{display:none}
.search-field{display:block;margin:20px 0 12px;font-size:12px}.search-field input{display:block;width:100%;margin-top:10px;padding:15px;background:transparent;border:1px solid var(--line);border-bottom:2px solid var(--yellow);border-radius:2px;color:var(--ink);font-size:17px}.search-status{font-size:12px;color:var(--muted);margin:16px 0 24px}.search-title{font:500 23px 'EB Garamond',serif;margin:26px 0 14px}
@media(max-width:540px){.rail{padding-left:0}.nav-button{width:38px;padding-left:7px}.nav-label{left:48px;height:44px;font-size:19px}.rail:hover,.rail:has(.nav-button:focus-visible){width:202px}.rail:hover .nav-button,.rail:has(.nav-button:focus-visible) .nav-button{width:195px}.nav-items{gap:12px}}
@media(prefers-reduced-motion:reduce){.rail,.nav-button,.nav-label{transition:none}}

/* Subtle softening; preserve the restrained, boxy character. */
.post,.person,.profile-avatar,.empty,dialog{border-radius:6px}
.post,.person{overflow:hidden}
.avatar,.primary,.field input,.field textarea,.search-field input,.profile-grid button,.profile-grid img{border-radius:5px}
.profile-grid button{overflow:hidden}
.nav-button{border-radius:6px;transition:width .24s cubic-bezier(.22,.61,.36,1),background-color .18s ease,color .18s ease}
.rail{transition:width .24s cubic-bezier(.22,.61,.36,1)}
.nav-label{opacity:0;visibility:hidden;transform:translateX(-8px);transition:opacity .18s ease,transform .24s cubic-bezier(.22,.61,.36,1),visibility 0s linear .24s}
.rail:hover .nav-label,.rail:has(.nav-button:focus-visible) .nav-label{opacity:1;visibility:visible;transform:translateX(0);transition-delay:0s}
@media(prefers-reduced-motion:reduce){.rail,.nav-button,.nav-label{transition:none}}

<script>
const icons={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',feed:'<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M9 9v12"/>',following:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-4-5"/>',create:'<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M12 7v10M7 12h10"/>',saved:'<path d="M6 3h12v18l-6-4-6 4z"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',moon:'<path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>'};const svg=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[n]+'</svg>';
const gradients=[['#648b49','#c5ad4d'],['#a8a24d','#dc983e'],['#d5ad4c','#db7845'],['#d99046','#bf5650'],['#d07849','#b55168'],['#bd5755','#96658c'],['#b45c77','#805e9f'],['#966092','#627caf'],['#7c69a5','#488fae'],['#617fb0','#529b9b'],['#4d8da6','#65955f'],['#50998a','#a3a356'],['#709f62','#d0ad66'],['#b39c59','#c97d76'],['#c07d78','#8d7da8'],['#8c7faa','#66948c']];
const people=[{name:'Elena',full:'Elena Voss',initials:'EV',color:'var(--green)',bio:'Lake days, long walks, little things.'},{name:'Marcus',full:'Marcus Tran',initials:'MT',color:'var(--yellow)',bio:'Coffee first. Camera second.'},{name:'Clara',full:'Clara Becker',initials:'CB',color:'var(--orange)',bio:'Somewhere near the mountains.'},{name:'Julian',full:'Julian Morel',initials:'JM',color:'var(--red)',bio:'A table with room for one more.'},{name:'David',full:'David Keller',initials:'DK',color:'var(--purple)',bio:'Taking the long way home.'},{name:'Sofia',full:'Sofia Rossi',initials:'SR',color:'var(--blue)',bio:'Collecting ordinary afternoons.'}];
const photos=['lake','coffee','cabin','dinner','tram'];const captions=['One more swim before the sun goes down.','First light, first thoughts.','A weekend with no particular plans.','Sunday at the table. Stayed until the candles went out.','Last tram home.','The water was colder than it looked.','A slow start is still a good start.','Rain on the roof, coffee on the porch.','Everyone brought something.','A familiar street in a different light.','Same lake. A different kind of afternoon.','Five quiet minutes before the day begins.','We took the longer route.','Saved a seat for you.','Missed the tram. Walked instead.','Nothing much happened. I want to remember it anyway.'];
const posts=captions.map((caption,i)=>({id:i,person:i%6,photo:'assets/'+photos[i%5]+'.jpg',caption,time:i<3?(i+1)+'h ago':'Yesterday',location:['Lake Oeschinen','At home','Valais','Sunday dinner','Old town'][i%5]}));let current='feed',selectedPerson=null;const saved=new Set(),liked=new Set();
const navs=[['feed','Feed','green'],['search','Search','yellow'],['following','Following','orange'],['create','Create','red'],['saved','Saved','purple'],['profile','Profile','blue']];document.getElementById('nav-items').innerHTML=navs.map(([id,label,color])=>'<button class="nav-button" data-view="'+id+'" style="--accent:var(--'+color+')" aria-label="'+label+'">'+svg(id)+'<span class="nav-label">'+label+'</span></button>').join('');
function personCard(p,i){return '<button class="person" data-person="'+i+'" style="--person-color:'+p.color+'" aria-label="View '+p.full+' profile"><span class="person-face" aria-hidden="true">'+p.initials+'</span><span class="person-name">'+p.name+'</span></button>'}
function postHTML(p,i){const person=people[p.person],colors=gradients[i%16];return '<article class="post" style="--gradient:linear-gradient(105deg,'+colors.join(',')+')"><header class="post-header"><button class="avatar" data-person="'+p.person+'" aria-label="View '+person.full+' profile">'+person.initials+'</button><div><div class="author">'+person.full+'</div><div class="location">'+p.location+'</div></div><span class="post-time">'+p.time+'</span></header><img class="photo" src="'+p.photo+'" alt="'+photos[p.id%5]+' photo shared by '+person.name+'" loading="lazy"><div class="post-bottom"><div class="post-actions"><button class="icon-button" data-like="'+p.id+'" aria-label="Like photo" aria-pressed="'+liked.has(p.id)+'">'+svg('heart')+'</button><button class="icon-button save" data-save="'+p.id+'" aria-label="Save photo" aria-pressed="'+saved.has(p.id)+'">'+svg('saved')+'</button></div><p class="caption"><strong>'+person.name+'</strong><span data-caption="'+p.id+'"></span></p></div><div class="post-end"></div></article>'}
function render(view='feed',person=null){current=view;selectedPerson=person;const root=document.getElementById('view');document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.getElementById('page-label').textContent=view==='profile'?'Your days, collected.':'A little of your everyday.';
if(view==='feed')root.innerHTML='<section aria-label="People you follow"><div class="section-heading"><h1>People you follow</h1><button class="text-button" data-view="following">View all</button></div><div class="people">'+people.map(personCard).join('')+'</div></section><div class="feed-heading"><h2>Your feed</h2><span>From your people</span></div>'+posts.map(postHTML).join('');
if(view==='search')root.innerHTML='<div class="feed-heading"><h2>Find a moment.</h2></div><label class="search-field" for="search-input">Search people, captions or places<input id="search-input" type="search" placeholder="Try Elena, coffee or Valais" autocomplete="off"></label><p class="search-status" id="search-status" role="status"></p><div id="search-results"></div>';
if(view==='following')root.innerHTML='<div class="feed-heading"><h2>People you follow</h2></div><div class="following-grid">'+people.map(personCard).join('')+'</div>';
if(view==='saved'){const items=posts.filter(p=>saved.has(p.id));root.innerHTML='<div class="feed-heading"><h2>Saved moments</h2></div>'+(items.length?items.map(p=>postHTML(p,p.id)).join(''):'<div class="empty"><h1>Keep something close.</h1><p>Save a photo from your feed to find it here.</p><button class="text-button" data-view="feed">Back to your feed</button></div>')}
if(view==='profile'){const p=person===null?{full:'Your moments',initials:'You',bio:'A place for the days you want to keep.'}:people[person];root.innerHTML='<section class="profile-header"><div class="profile-avatar">'+p.initials+'</div><div><h1>'+p.full+'</h1><p>'+p.bio+'</p><p>'+ (person===null?'Your photo collection':'Following')+'</p></div></section><div class="profile-grid">'+posts.filter(x=>person===null||x.person===person).map((p,i)=>'<button data-detail="'+p.id+'" style="--color:'+gradients[i%16][0]+'" aria-label="Open photo"><img src="'+p.photo+'" alt="'+photos[p.id%5]+' moment" loading="lazy"></button>').join('')+'</div>'}
if(view==='search'){document.getElementById('search-input').addEventListener('input',updateSearch);updateSearch()}
document.querySelectorAll('[data-caption]').forEach(e=>e.textContent=posts.find(p=>p.id===Number(e.dataset.caption)).caption);}
function updateSearch(){const query=document.getElementById('search-input').value.trim().toLocaleLowerCase();const results=document.getElementById('search-results');const status=document.getElementById('search-status');if(!query){status.textContent='Search the sample people and moments in this preview.';results.innerHTML='';return}const matchedPeople=people.map((p,i)=>({p,i})).filter(({p})=>(p.full+' '+p.bio).toLocaleLowerCase().includes(query));const matchedPosts=posts.filter(p=>(p.caption+' '+p.location+' '+people[p.person].full).toLocaleLowerCase().includes(query));status.textContent=matchedPeople.length+(matchedPeople.length===1?' person · ':' people · ')+matchedPosts.length+(matchedPosts.length===1?' moment':' moments');results.innerHTML=(matchedPeople.length?'<h3 class="search-title">People</h3><div class="following-grid">'+matchedPeople.map(({p,i})=>personCard(p,i)).join('')+'</div>':'')+(matchedPosts.length?'<h3 class="search-title">Moments</h3>'+matchedPosts.map(p=>postHTML(p,p.id)).join(''):'')+(!matchedPeople.length&&!matchedPosts.length?'<div class="empty"><h3>No moments found.</h3><p>Try a name, a place or another word.</p></div>':'');results.querySelectorAll('[data-caption]').forEach(e=>e.textContent=posts.find(p=>p.id===Number(e.dataset.caption)).caption)}
let toastTimer;function announce(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2200)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){if(b.dataset.view==='create')document.getElementById('create-dialog').showModal();else{render(b.dataset.view);window.scrollTo(0,0)}}if(b.dataset.person!==undefined){render('profile',Number(b.dataset.person));window.scrollTo(0,0)}if(b.dataset.like!==undefined){const n=Number(b.dataset.like);liked.has(n)?liked.delete(n):liked.add(n);b.setAttribute('aria-pressed',String(liked.has(n)))}if(b.dataset.save!==undefined){const n=Number(b.dataset.save);saved.has(n)?saved.delete(n):saved.add(n);b.setAttribute('aria-pressed',String(saved.has(n)));announce(saved.has(n)?'Saved to your moments':'Removed from saved moments');if(current==='saved')render('saved')}if(b.dataset.detail!==undefined){const p=posts.find(p=>p.id===Number(b.dataset.detail));document.getElementById('detail-image').src=p.photo;document.getElementById('detail-caption').textContent=p.caption;document.getElementById('photo-dialog').showModal()}if(b.classList.contains('dialog-close'))b.closest('dialog').close()});
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('theme-icon').innerHTML=svg(dark?'sun':'moon');document.getElementById('theme-label').textContent=dark?'Switch to light theme':'Switch to dark theme';document.getElementById('theme').setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')};document.getElementById('theme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme!=='dark'));document.getElementById('home').addEventListener('click',e=>{e.preventDefault();render();window.scrollTo(0,0)});
let uploaded=null;document.getElementById('photo-file').addEventListener('change',e=>{if(uploaded)URL.revokeObjectURL(uploaded);const file=e.target.files[0];uploaded=file?URL.createObjectURL(file):null;const img=document.getElementById('upload-preview');img.hidden=!uploaded;if(uploaded)img.src=uploaded});document.getElementById('create-form').addEventListener('submit',e=>{e.preventDefault();if(!uploaded)return;const id=posts.length;posts.unshift({id,person:0,photo:uploaded,caption:document.getElementById('photo-caption').value||'A new moment.',time:'Just now',location:'Local preview'});uploaded=null;document.getElementById('create-dialog').close();render();window.scrollTo(0,0);announce('Added to this preview only');e.target.reset();document.getElementById('upload-preview').hidden=true});setTheme(new URLSearchParams(location.search).get('theme')==='dark');render();
</script><script src="settings.js"></script><script src="social.js"></script><script src="page-motion.js"></script><script src="shared-chrome.js"></script><script src="chat-draft.js"></script></body></html>
