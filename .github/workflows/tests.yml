name: tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: momento_test
          POSTGRES_USER: momento_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U momento_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Check authentication with PostgreSQL and Redis
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: momento_test
          DB_USERNAME: momento_test
          DB_PASSWORD: ci-only-password
          SESSION_DRIVER: database
          CACHE_STORE: redis
          CACHE_PREFIX: auth-test-${{ github.run_id }}-${{ github.run_attempt }}-
        run: >-
          php artisan test --compact
          tests/Feature/Auth/SessionLifecycleTest.php
          tests/Feature/Auth/QueuedAuthenticationMailTest.php
          tests/Feature/Auth/AuthenticationRateLimitTest.php
          tests/Feature/Auth/ServiceFailureTest.php

  container:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/container.yml

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      publish: true

  verify-artifact:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - name: Verify package privacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${GITHUB_REPOSITORY#*/}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/users/$GITHUB_REPOSITORY_OWNER/packages/container/$package" \
            --output "$RUNNER_TEMP/package.json"
          python3 - "$RUNNER_TEMP/package.json" <<'PY'
          import json, sys
          if json.load(open(sys.argv[1]))["visibility"] != "private":
              raise SystemExit("Package must remain private")
          PY

      - name: Verify anonymous pull is denied
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/anonymous.json" --write-out '%{http_code}' \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repository:pull")
          case "$status" in
            200|401|403) ;;
            *) echo "::error::Anonymous token request failed: HTTP $status"; exit 1 ;;
          esac
          if [ "$status" = 200 ]; then
            token=$(python3 - "$RUNNER_TEMP/anonymous.json" <<'PY'
          import json, sys
          token = json.load(open(sys.argv[1])).get("token")
          if not isinstance(token, str) or not token.strip():
              raise SystemExit("Invalid anonymous registry token")
          print(token)
          PY
            )
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/$repository/manifests/${IMAGE##*@}")
          fi
          case "$status" in
            401|403|404) echo 'Anonymous image pull denied' ;;
            *) echo "::error::Unexpected anonymous registry response: $status"; exit 1 ;;
          esac

      - name: Pull exact digest with read-only authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
        run: |
          [[ "$IMAGE" == "ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"* ]]
          [[ "${IMAGE##*@}" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE")" = "https://github.com/$GITHUB_REPOSITORY"
          {
            echo '### Verified private image'
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo "Image: \`$IMAGE\`"
            echo
            echo 'Private visibility, anonymous denial and a fresh read-only digest pull passed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry authentication
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
        run: rm -rf "$DOCKER_CONFIG"
