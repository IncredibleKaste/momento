<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome back — Momento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--bg:#f6f1e6;--ink:#302d27;--muted:#716a60;--line:#d9d1c2;--surface:#faf7ef;--green:#648b49;--blue:#4c85a7}html[data-theme=dark]{color-scheme:dark;--bg:#211f1b;--ink:#eee8dc;--muted:#ada698;--line:#484237;--surface:#27241f;--green:#a0bf78;--blue:#8cbcd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,a{font:inherit}button,a{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:4px}button{background:none;border:0}.top{max-width:1260px;margin:auto;padding:32px 48px;display:flex;align-items:center;justify-content:space-between}.wordmark{font:500 38px 'EB Garamond',serif;letter-spacing:-1.5px;text-decoration:none}.theme{padding:10px;border:1px solid var(--line);border-radius:5px;font-size:12px}.layout{max-width:1164px;margin:26px auto 60px;display:grid;grid-template-columns:1.2fr 1fr;gap:100px;align-items:center;padding:0 36px}.story h1{font:500 clamp(46px,5vw,70px)/.99 'EB Garamond',serif;letter-spacing:-1.5px;margin:0 0 28px;max-width:490px}.story-photo{position:relative;overflow:hidden;border-radius:6px}.story-photo img{width:100%;height:350px;display:block;object-fit:cover}.spectrum{height:7px;display:grid;grid-template-columns:repeat(6,1fr)}.spectrum i:nth-child(1){background:#648b49}.spectrum i:nth-child(2){background:#d9b350}.spectrum i:nth-child(3){background:#d87c38}.spectrum i:nth-child(4){background:#be5350}.spectrum i:nth-child(5){background:#87619b}.spectrum i:nth-child(6){background:#4c85a7}.story-caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-top:14px;gap:20px}.login{max-width:380px;width:100%}.login h2{font:500 40px 'EB Garamond',serif;margin:0 0 8px}.intro{color:var(--muted);line-height:1.6;margin:0 0 28px}.field{display:block;font-size:13px;margin:18px 0}.field input{width:100%;margin-top:9px;padding:13px 12px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;font-size:15px}.password{position:relative;display:block}.password input{padding-right:64px}.password button{position:absolute;right:7px;top:18px;padding:7px;font-size:12px;color:var(--muted)}.forgot{display:block;margin:-5px 0 21px auto;font-size:12px;text-decoration:underline;text-underline-offset:3px}.primary,.provider{width:100%;border-radius:5px;padding:13px 16px;min-height:46px}.primary{background:var(--ink);color:var(--bg);font-weight:500}.divider{display:flex;align-items:center;gap:15px;color:var(--muted);font-size:12px;margin:24px 0 17px}.divider:before,.divider:after{content:'';height:1px;flex:1;background:var(--line)}.provider{border:1px solid var(--line);margin:5px 0;text-align:left;display:flex;align-items:center;gap:14px;background:transparent}.provider:hover{background:var(--surface)}.provider .mark{width:22px;font-weight:600;color:var(--accent);font-size:18px;text-align:center}.signup{text-align:center;font-size:13px;margin:24px 0}.signup button{text-decoration:underline;text-underline-offset:3px;padding:0}.preview{font-size:11px;color:var(--muted);text-align:center;line-height:1.7}.preview a{text-underline-offset:3px}dialog{width:min(420px,calc(100% - 32px));padding:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#0006;backdrop-filter:blur(3px)}dialog h2{font:30px 'EB Garamond',serif;margin-top:0}dialog p{line-height:1.7}dialog .close{position:absolute;top:12px;right:12px;font-size:22px}.preview-entry{display:block;margin:12px auto;text-align:center}#status{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0 0}@media(max-width:900px){.layout{gap:45px;grid-template-columns:1fr 1fr}.story-photo img{height:300px}.story h1{font-size:49px}}@media(max-width:650px){.top{padding:22px 24px}.layout{display:block;padding:0 24px;margin:18px auto 40px;max-width:430px}.story{display:none}.login{max-width:none}.login h2{font-size:38px}.wordmark{font-size:34px}}
</style><link rel="stylesheet" href="login-refinement.css"><link rel="stylesheet" href="shared-chrome.css"></head><body class="login-page"><header class="top"><a class="wordmark" href="welcome.html" data-destination>Momento<span class="brand-spectrum" aria-hidden="true"></span></a><button class="theme-toggle" id="theme" type="button" aria-label="Switch to dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z"/></svg></button></header><main class="layout"><section class="story" aria-label="Everyday memories"><h1>For the days<br>you want to keep.</h1><div class="moments" aria-label="A moving collection of everyday photographs"><figure class="moment is-current" aria-hidden="false"><img class="moment-photo" src="assets/lake.jpg" alt="A swimmer in a quiet alpine lake" width="600" height="700" decoding="async"></figure><figure class="moment" aria-hidden="true"><img class="moment-photo" src="assets/dinner.jpg" alt="Friends gathered around a dinner table" width="600" height="700" decoding="async"></figure><figure class="moment" aria-hidden="true"><img class="moment-photo" src="assets/tram.jpg" alt="A vintage tram crossing a city street" width="600" height="700" decoding="async"></figure><figure class="moment" aria-hidden="true"><img class="moment-photo" src="assets/cabin.jpg" alt="A cabin among misty trees" width="600" height="700" decoding="async"></figure><figure class="moment" aria-hidden="true"><img class="moment-photo" src="assets/coffee.jpg" alt="Coffee and a notebook in morning light" width="600" height="700" decoding="async"></figure></div><div class="moment-controls"><span>A little of life, in motion.</span><button type="button" id="moment-play" aria-pressed="false">Pause motion</button></div></section><section class="login"><h2>Welcome back.</h2><p class="intro">A little of your everyday, all in one place.</p><form id="login-form" action="#" onsubmit="return false"><label class="field">Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field">Password<span class="password"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="show" aria-label="Show password" aria-pressed="false">Show</button></span></label><button class="forgot" type="button" data-info="reset">Forgot password?</button><button class="primary login-submit" type="submit"><span>Sign in</span></button><p id="status" role="status"></p></form><div class="divider">or continue with</div><div class="providers" role="group" aria-label="Continue with an external provider"><button type="button" class="provider" data-info="Google" aria-label="Sign in with Google"><img src="assets/google-logo.png" alt="" width="18" height="18"><span>Google</span></button><button type="button" class="provider" data-info="Microsoft ID" aria-label="Sign in with Microsoft ID"><svg aria-hidden="true" class="w-3.5 h-3.5" viewBox="0 0 21 21">

</svg><span>Microsoft ID</span></button><button type="button" class="provider" data-info="Switch edu-ID" aria-label="Sign in with Switch edu-ID"><img src="assets/switch-eduid.svg" alt="" width="18" height="18"><span>edu-ID</span></button></div><p class="signup">New here? <button data-info="signup">Create an account</button></p><p class="preview">Design preview — use sample details only.<br>No credentials are sent or stored.</p><a class="preview preview-entry" id="preview-link" href="instant-memories-v2.html">Explore the feed preview</a></section></main><footer class="site-footer"><span>© <span data-copyright-year>2026</span> Momento</span><nav aria-label="Footer"><a href="privacy.html" data-destination>Privacy</a><a href="impressum.html" data-destination>Impressum</a></nav></footer><dialog id="info"><button class="close" aria-label="Close">×</button><h2 id="info-title"></h2><p id="info-copy"></p><button class="primary" id="info-done">Got it</button></dialog><script>
const themeButton=document.getElementById('theme');function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';themeButton.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');document.getElementById('preview-link').href='instant-memories-v2.html?theme='+(dark?'dark':'light')}setTheme(new URLSearchParams(location.search).get('theme')==='dark');themeButton.onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');document.getElementById('show').onclick=e=>{const input=document.getElementById('password'),show=input.type==='password';input.type=show?'text':'password';e.target.textContent=show?'Hide':'Show';e.target.setAttribute('aria-label',show?'Hide password':'Show password');e.target.setAttribute('aria-pressed',String(show))};document.getElementById('login-form').onsubmit=e=>{e.preventDefault();e.target.reset();document.getElementById('status').textContent='Opening the feed preview…';window.momentoNavigate('instant-memories-v2.html')};const info=document.getElementById('info');document.querySelectorAll('[data-info]').forEach(button=>button.onclick=()=>{const value=button.dataset.info;document.getElementById('info-title').textContent=value==='reset'?'Reset your password.':value==='signup'?'Make room for your moments.':'Continue with '+value;document.getElementById('info-copy').textContent=value==='reset'?'The finished app will let you request a password reset email here. No email is sent from this preview.':value==='signup'?'Account creation is the next screen in this flow. This preview does not create an account.':'This will open the '+value+' sign-in flow in the finished app. Provider authentication is not connected in this preview.';info.showModal()});document.querySelector('#info .close').onclick=()=>info.close();document.getElementById('info-done').onclick=()=>info.close();
</script><script src="page-motion.js"></script><script src="login-moments.js"></script><script src="shared-chrome.js"></script></body></html>
